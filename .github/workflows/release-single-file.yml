name: Single-file release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build the single-file artifact
        run: |
          chmod +x build_single.sh
          ./build_single.sh
          (cd dist && sha256sum -c nebula-manager.sha256)

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "Nebula Manager $tag"
          fi
          gh release upload "$tag" dist/nebula-manager dist/nebula-manager.sha256 --clobber
